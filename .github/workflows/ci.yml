name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Skip doc-only PRs: root Markdown, docs/ and evidence/ are not read by build, lint,
      # typecheck or tests. Package Markdown (SKILL.md, README, CHANGELOG) is packed and tested, so it still runs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!evidence/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!**/CODEOWNERS'
  check:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tsc
      - run: npm test

  typecheck-linux:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # linux/amd64 under Colima's Rosetta keeps the x64 Linux coverage ubuntu-latest gave.
      - name: Type-check and check docs in a Linux container
        run: |
          host_dir=$(.github/scripts/colima-stage.sh)
          cleanup() { rm -rf "$host_dir"; }
          trap cleanup EXIT
          rsync -a --exclude node_modules ./ "$host_dir/"
          export LINUX_HOST_DIR="$host_dir"
          .github/scripts/linux-run.sh linux/amd64 node:24-bookworm sh -ec '
            npm ci
            npm run build
            npm run typecheck
            npm run typecheck:tsc
            npm run docs:check
            npm run docs:check:tsc
          '
