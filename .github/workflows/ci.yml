name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Skip doc-only PRs: root Markdown, docs/ and evidence/ are not read by build, lint,
      # typecheck or tests. Package Markdown (SKILL.md, README, CHANGELOG) is packed and tested, so it still runs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!evidence/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!**/CODEOWNERS'
  check:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:tsc
      - run: bun run test

  typecheck-linux:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # linux/amd64 under Colima's Rosetta keeps the x64 Linux coverage ubuntu-latest gave.
      - name: Type-check and check docs in a Linux container
        run: |
          bun_dir=$(BUN_VERSION=1.4.4 .github/scripts/fetch-linux-bun.sh x64)
          host_dir=$(.github/scripts/colima-stage.sh)
          cleanup() { rm -rf "$host_dir"; }
          trap cleanup EXIT
          rsync -a --exclude node_modules ./ "$host_dir/"
          mkdir -p "$host_dir/bun"
          cp "$bun_dir/bun" "$host_dir/bun/bun"
          export LINUX_HOST_DIR="$host_dir"
          .github/scripts/linux-run.sh linux/amd64 node:24-bookworm sh -ec '
            bun install --frozen-lockfile
            bun run build
            bun run typecheck
            bun run typecheck:tsc
            bun run docs:check
            bun run docs:check:tsc
          '
