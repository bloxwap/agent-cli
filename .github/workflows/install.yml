name: Install smoke
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Run for package/build inputs, including packaged Markdown, workspace installs, and smoke helpers.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'packages/agent-cli/**'
              - '**/package.json'
              - '**/*lock*'
              - '**/.npmrc'
              - '**/.npmignore'
              - '.github/scripts/**'
              - '.github/workflows/install.yml'
  install:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Install smoke (all variants)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # setup-node populates separate versioned toolcache directories. Capture each
      # path before the next setup changes PATH; parallel workers use explicit paths.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - run: echo "SMOKE_NODE_22_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: echo "SMOKE_NODE_24_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'
      - run: npm ci
      - run: npm run build
      - name: Install the packed artifact on macOS and Linux with Node 22.12 and 24
        run: bash .github/scripts/install-smoke-parallel.sh
        env:
          BUN_VERSION: '1.3.10'
