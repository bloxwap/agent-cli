name: Install smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the packed artifact with lifecycle scripts disabled
        run: npm run test:package
        env:
          BLOXWAP_SMOKE_BUN: '1'
