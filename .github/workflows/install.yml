name: Install smoke
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Run for package/build inputs, including packaged Markdown, workspace installs, and smoke helpers.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'packages/agent-cli/**'
              - '**/package.json'
              - '**/*lock*'
              - '**/.npmrc'
              - '**/.npmignore'
              - '.github/scripts/**'
              - '.github/workflows/install.yml'
  install:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Node 22.12
            node: '22.12.0'
            target: macos
          - name: macOS Node 24
            node: '24'
            target: macos
          - name: Linux Node 22.12
            node: '22.12.0'
            target: linux
            docker_platform: linux/amd64
            bun_arch: x64
            node_image: node:22.12.0-bookworm
          - name: Linux Node 24
            node: '24'
            target: linux
            docker_platform: linux/amd64
            bun_arch: x64
            node_image: node:24-bookworm
    name: ${{ matrix.name }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        if: matrix.target == 'macos'
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the packed artifact with lifecycle scripts disabled
        if: matrix.target == 'macos'
        run: npm run test:package
        env:
          BLOXWAP_SMOKE_BUN: '1'
      - name: Pack the install artifact
        if: matrix.target == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --workspace @bloxwap/agent-cli --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the packed artifact in a Linux container
        if: matrix.target == 'linux'
        env:
          BLOXWAP_SMOKE_BUN: '1'
          BUN_VERSION: '1.3.10'
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          BUN_ARCH: ${{ matrix.bun_arch }}
          NODE_IMAGE: ${{ matrix.node_image }}
        run: |
          bun_dir=$(.github/scripts/fetch-linux-bun.sh "$BUN_ARCH")
          tarball=
          for candidate in "$RUNNER_TEMP/pack"/*.tgz; do
            tarball=$candidate
          done
          if [ ! -f "$tarball" ]; then
            echo "packed tarball not found in $RUNNER_TEMP/pack" >&2
            exit 1
          fi
          host_dir=$(.github/scripts/colima-stage.sh)
          cleanup() { rm -rf "$host_dir"; }
          trap cleanup EXIT
          mkdir -p "$host_dir/pack" "$host_dir/bun"
          cp "$bun_dir/bun" "$host_dir/bun/bun"
          chmod +x "$host_dir/bun/bun"
          cp "$tarball" "$host_dir/pack/"
          cp packages/agent-cli/package.json "$host_dir/package.json"
          cp packages/agent-cli/scripts/package-smoke.mjs "$host_dir/package-smoke.mjs"
          BLOXWAP_SMOKE_TARBALL=/work/pack/$(basename "$tarball")
          export BLOXWAP_SMOKE_TARBALL BLOXWAP_SMOKE_BUN
          export LINUX_HOST_DIR="$host_dir"
          .github/scripts/linux-run.sh "$DOCKER_PLATFORM" "$NODE_IMAGE" \
            node package-smoke.mjs
