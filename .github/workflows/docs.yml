name: Documentation

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'vendor/**', 'hig-drift.json', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'vendor/**', 'hig-drift.json', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Release scan, parallel with build. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@0387d86d796b5a80509a9862b35991a160ff13b4 # v1.0.1
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NEXT_PUBLIC_BASE_PATH: /agent-cli
      NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:check
      - run: npm run lint
      # Scoped HIG anti-drift check from the exact source of registry release 0.1.0.
      - uses: actions/checkout@v7
        with:
          repository: bloxwap/hig
          ref: bdf8d07014fea5e69ea51a061b82707661a9d701
          path: .hig
          sparse-checkout: scripts/drift.mjs
          sparse-checkout-cone-mode: false
      - run: node .hig/scripts/drift.mjs --root . --config hig-drift.json
      - run: npx playwright install chromium
      - run: npm run docs:smoke
      - name: Ensure GNU tar
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: .github/scripts/ensure-gnu-tar.sh
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/docs/out

  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build, security]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
