name: Documentation

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'vendor/**', 'hig-drift.json', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'vendor/**', 'hig-drift.json', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NEXT_PUBLIC_BASE_PATH: /agent-cli
      NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:check
      - run: npm run lint
      # Scoped HIG anti-drift check from the same HIG commit as vendor/bloxwap-hig (bloxwap/hig#58).
      - uses: actions/checkout@v7
        with:
          repository: bloxwap/hig
          ref: 872906a9071469af8714b3b6fb5cc7bd64d2d6f3
          path: .hig
          sparse-checkout: scripts/drift.mjs
          sparse-checkout-cone-mode: false
      - run: node .hig/scripts/drift.mjs --root . --config hig-drift.json
      - run: npx playwright install chromium
      - run: npm run docs:smoke
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
