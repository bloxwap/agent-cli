name: Testnet lifecycle
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dedicated-testnet-account
  cancel-in-progress: false
jobs:
  testnet:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    environment: testnet
    env:
      BLOXWAP_E2E: '1'
      # This wallet and Privy app belong to disposable company CI, never users.
      BLOXWAP_TEST_ACCOUNT_ONLY: '1'
      BLOXWAP_TEST_MASTER_KEY: ${{ secrets.AGENT_CLI_TEST_MASTER_KEY }}
      BLOXWAP_PRIVY_APP_ID: ${{ secrets.AGENT_CLI_PRIVY_APP_ID }}
      BLOXWAP_PRIVY_APP_SECRET: ${{ secrets.AGENT_CLI_PRIVY_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the live testnet lifecycle (Relay mocked)
        run: .github/scripts/testnet-run.sh
      - name: Record testnet coverage and outcome
        if: always()
        run: node packages/agent-cli/scripts/testnet-summary.mjs packages/agent-cli/artifacts/lifecycle-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-journals-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/agent-cli/artifacts/lifecycle-report.json
            packages/agent-cli/artifacts/events.jsonl
            packages/agent-cli/artifacts/events-follow.jsonl
            packages/agent-cli/artifacts/audit.jsonl
            packages/agent-cli/artifacts/runner*.jsonl
