name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-cli-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    # Release scan, parallel with build.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    name: Candidate
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'
      - name: Verify version, skill, release notes and tagged main ancestry
        run: node packages/agent-cli/scripts/verify-release.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify installed npm and bunx package
        run: npm run test:package
        env:
          BLOXWAP_SMOKE_BUN: '1'
      - name: Cross-compile native executables for every target
        run: npm run build:binaries
      - name: Ensure Colima
        run: .github/scripts/ensure-colima.sh
      - name: Smoke-test the linux-x64 binary in linux/amd64
        env:
          BLOXWAP_SMOKE_DOCKER_PLATFORM: linux/amd64
        run: node packages/agent-cli/scripts/binary-smoke.mjs packages/agent-cli/binaries/agent-cli-linux-x64
      - name: Smoke-test the linux-arm64 binary in linux/arm64
        env:
          BLOXWAP_SMOKE_DOCKER_PLATFORM: linux/arm64
        run: node packages/agent-cli/scripts/binary-smoke.mjs packages/agent-cli/binaries/agent-cli-linux-arm64
      - name: Smoke-test the darwin-x64 binary under Rosetta
        env:
          BLOXWAP_SMOKE_ROSETTA: '1'
        run: node packages/agent-cli/scripts/binary-smoke.mjs packages/agent-cli/binaries/agent-cli-darwin-x64
      - name: Smoke-test the darwin-arm64 binary
        run: node packages/agent-cli/scripts/binary-smoke.mjs packages/agent-cli/binaries/agent-cli-darwin-arm64
      - name: Ensure generated tracked files match the release commit
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-x64
          path: packages/agent-cli/binaries/agent-cli-linux-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-arm64
          path: packages/agent-cli/binaries/agent-cli-linux-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-darwin-x64
          path: packages/agent-cli/binaries/agent-cli-darwin-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-darwin-arm64
          path: packages/agent-cli/binaries/agent-cli-darwin-arm64
          if-no-files-found: error
      - name: Pack the tested npm release artifact
        run: |
          mkdir -p packages/agent-cli/artifacts
          npm pack --workspace @bloxwap/agent-cli --ignore-scripts --pack-destination packages/agent-cli/artifacts
          cp packages/agent-cli/SKILL.md packages/agent-cli/CHANGELOG.md packages/agent-cli/LICENSE packages/agent-cli/artifacts/
      - name: Verify the exact release tarball
        run: |
          for release_tarball in "$PWD"/packages/agent-cli/artifacts/*.tgz; do
            BLOXWAP_SMOKE_TARBALL="$release_tarball" npm run test:package
          done
        env:
          BLOXWAP_SMOKE_BUN: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: packages/agent-cli/artifacts/*
          if-no-files-found: error
  # npm trusted publishing does not support self-hosted runners
  # (https://docs.npmjs.com/trusted-publishers/). This job authenticates with
  # the organization NPM_TOKEN secret instead. That drops OIDC trusted
  # publishing and automatic provenance.
  publish:
    needs: [build, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.BLOXWAP_PUBLISH == '1'
    runs-on: [self-hosted, macOS, ARM64]
    environment: npm-release
    concurrency:
      group: agent-cli-npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'
      - name: Recheck tagged main ancestry before publishing
        run: node packages/agent-cli/scripts/verify-release.mjs
      - name: Verify npm publish authentication
        run: node packages/agent-cli/scripts/check-publish-auth.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release
      - name: Prepare release checksums
        run: node packages/agent-cli/scripts/release-checksums.mjs release
      - name: Publish the tested tarball
        run: node packages/agent-cli/scripts/publish-artifact.mjs release
      - name: Verify published integrity
        run: node packages/agent-cli/scripts/verify-publication.mjs release
      - name: Verify public npm install and bunx
        run: npm run test:package
        env:
          BLOXWAP_SMOKE_REGISTRY: '1'
          BLOXWAP_SMOKE_BUN: '1'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
