name: Version packages
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version:packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
